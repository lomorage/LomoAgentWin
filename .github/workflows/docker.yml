# Builds the Linux Docker image (docker/Dockerfile: lomod + exiftool + ffmpeg + the web app and
# proxy), runs scripts/ci/docker-smoke.sh against it, and only then pushes it to
# ghcr.io/<owner>/lomo-photo-viewer.
#
# Tags pushed:
#   push to a branch     -> <branch> and sha-<commit>
#   tag docker-vX.Y.Z    -> X.Y.Z and latest, plus a GitHub Release
#   tag docker-vX.Y.Z-*  -> X.Y.Z-* and test, plus a GitHub pre-release (a test version)
# Pull requests build and test but push nothing.
name: Docker image

on:
  push:
    branches: [main, "claude/**"]
    tags: ["docker-v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/lomo-photo-viewer

jobs:
  image:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: write # GitHub Release on docker-v* tags
      packages: write # push to ghcr.io
    steps:
      - uses: actions/checkout@v7

      - name: Check out the immich and lomod submodules
        run: git submodule update --init --depth 1 submodules/immich submodules/lomod

      - name: Versions
        id: version
        run: |
          # Same format as lomod's own release builds: <build time>.0.<lomod commit>
          echo "lomod=$(date -u +%Y-%m-%d.%H-%M-%S).0.$(git -C submodules/lomod rev-parse --short=7 HEAD)" >> "$GITHUB_OUTPUT"
          prerelease=false
          [[ "$GITHUB_REF_NAME" == docker-v*-* ]] && prerelease=true
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=ref,event=branch
            type=sha,prefix=sha-
            type=match,pattern=docker-v(.*),group=1
            type=raw,value=test,enable=${{ startsWith(github.ref, 'refs/tags/docker-v') && steps.version.outputs.prerelease == 'true' }}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/docker-v') && steps.version.outputs.prerelease == 'false' }}
          labels: |
            org.opencontainers.image.title=Lomo Photo Viewer
            org.opencontainers.image.description=lomod photo storage with the Immich-based web app, for Linux servers

      - uses: docker/setup-buildx-action@v3

      - name: Build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          build-args: LOMOD_VERSION=${{ steps.version.outputs.lomod }}
          load: true
          tags: lomo-photo-viewer:ci
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - uses: actions/setup-node@v6
        with:
          node-version: 24.13.1

      - name: Smoke test the image
        run: scripts/ci/docker-smoke.sh lomo-photo-viewer:ci

      - name: Test the one-command installer
        # As users run it (piped into bash), against the image just built; then again, which is
        # how users upgrade: the account and settings must survive.
        run: |
          export LOMO_DIR="$RUNNER_TEMP/lomo"
          login() {
            curl -s -o /dev/null -w '%{http_code}' -H 'Content-Type: application/json' \
              -d "{\"email\":\"admin\",\"password\":\"$1\"}" http://127.0.0.1:3001/api/auth/login
          }
          out=$(LOMO_IMAGE=lomo-photo-viewer:ci bash < docker/install.sh 2>&1) || { echo "$out"; exit 1; }
          echo "$out"
          password=$(grep -oP 'Account:  user: admin   password: \K\S+' <<<"$out")
          [ -n "$password" ] || { echo "installer did not print the generated password"; exit 1; }
          grep -q 'Web app (computer or phone browser):  http://' <<<"$out" || { echo "no web address printed"; exit 1; }
          [ "$(login "$password")" = 201 ] || { echo "login with the printed password failed"; exit 1; }
          bash < docker/install.sh
          [ "$(login "$password")" = 201 ] || { echo "login failed after re-running the installer"; exit 1; }
          grep -q '^LOMO_IMAGE=lomo-photo-viewer:ci$' "$LOMO_DIR/.env" || { echo "re-run did not keep the settings"; exit 1; }
          (cd "$LOMO_DIR" && docker compose down)

      - name: Log in to ghcr.io
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          build-args: LOMOD_VERSION=${{ steps.version.outputs.lomod }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha

      - name: GitHub Release
        if: startsWith(github.ref, 'refs/tags/docker-v')
        uses: softprops/action-gh-release@v2
        with:
          prerelease: ${{ steps.version.outputs.prerelease == 'true' }}
          files: |
            docker/install.sh
            docker/docker-compose.yml
            docker/README.md
          body: |
            Docker image for Linux (linux/amd64): lomod (lomorage/lomod@${{ steps.version.outputs.lomod }}) with exiftool and ffmpeg, plus the web app.

            ```
            docker pull ${{ env.IMAGE }}:${{ steps.meta.outputs.version }}
            ```

            One-command install on a Linux machine (installs Docker if needed, then prints the web address and the first account's password):

            ```
            curl -fsSL https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/install.sh | LOMO_IMAGE=${{ env.IMAGE }}:${{ steps.meta.outputs.version }} bash
            ```

            Or download `docker-compose.yml` from this release and run `docker compose up -d`. Full instructions (Chinese): `README.md` below.
