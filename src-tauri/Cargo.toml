[package]
name = "lomo-photo-viewer"
version = "1.0.10"
edition = "2021"

[dependencies]
tauri = { version = "2", features = ["devtools", "tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zip = "4"
rfd = "0.15"
rusqlite = { version = "0.31", features = ["bundled"] }
argon2 = "0.5"
base64 = "0.22"

[build-dependencies]
tauri-build = { version = "2", features = [] }

# Speed up release builds: allow parallel codegen across 16 units (default=1).
# Trade-off: slightly larger binary, no runtime perf difference for this app.
[profile.release]
codegen-units = 16
opt-level = 2   # default=3; level 2 is nearly as fast at runtime, compiles much faster
